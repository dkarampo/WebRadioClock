<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablet clock</title>
<style>
:root{--bg:#17110a;--fg:#f0c27b;--dim:#caa675;--line:#3d2d1b;--field:#241a10}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Roboto,"Helvetica Neue",Arial,sans-serif;font-weight:500;overflow:hidden}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;padding:3vmin 5vmin;transition:opacity .8s}
body.dim #app{opacity:.35}
header{display:flex;justify-content:space-between;align-items:center}
#date{font-size:4.6vmin;font-weight:600;color:var(--dim)}
#wk{font-size:3vmin;font-weight:600;color:var(--dim);opacity:.8;margin-top:.6vmin}
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
#time{font-size:56vmin;font-weight:700;line-height:.85;letter-spacing:-.03em;white-space:nowrap;font-variant-numeric:tabular-nums}
#ap{font-size:12vmin;margin-left:2vmin;color:var(--dim)}
#wx{display:flex;align-items:center;justify-content:center;font-size:8vmin;font-weight:700;margin-top:3vmin}
#wxi svg{overflow:visible;display:block;width:11vmin;height:11vmin;margin-right:2.5vmin;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#wx2{font-size:3.8vmin;font-weight:600;color:var(--dim);margin-top:1vmin}
footer{display:flex;align-items:center;border-top:1px solid var(--line);padding-top:2.5vmin}
#np{flex:1;min-width:0}
#stn{display:block;font-size:5vmin;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st{font-size:3.2vmin;font-weight:600;color:var(--dim)}
textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px}
button,select,input[type=text],input:not([type]){font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 18px;min-height:52px;font-size:20px;font-weight:600}
@media (orientation:portrait){#time{font-size:37vmin}#ap{font-size:9vmin}}
button{cursor:pointer;margin-left:10px}
button:focus,input:focus,select:focus{outline:2px solid var(--fg)}
#pp{min-width:110px}
#cast{width:52px;padding:0;display:flex;align-items:center;justify-content:center}
#cast.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#cast svg{display:block;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#hb{position:absolute;top:3vmin;right:5vmin;display:flex;flex-direction:column;align-items:center}
#hb button+button{margin-top:10px}
#hb button{margin-left:0}
.mini{height:44px;min-height:44px;padding:0 14px;font-size:16px;line-height:1;opacity:.55}
.mini:focus{opacity:1}
#fs2,#gear{width:44px;padding:0;display:flex;align-items:center;justify-content:center}
#gear svg{stroke-width:2!important}
#fs2 svg,#gear svg{display:block;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#keys{position:fixed;left:12px;bottom:12px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:18px;z-index:5}
#panel{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(16,11,6,.97);overflow-y:auto;z-index:4}
.sheet{max-width:720px;margin:0 auto;padding:20px}
.row{display:flex;align-items:center;margin:8px 0}
.row input{flex:1;min-width:0}
h2,h3,h4{margin:18px 0 8px;font-weight:400}
h2{font-size:28px}h3{font-size:22px;border-top:1px solid var(--line);padding-top:16px}h4{font-size:18px;color:var(--dim)}
label{display:flex;align-items:center;margin:10px 0;font-size:20px}
label input{width:24px;height:24px;margin-right:12px}
label select{margin-left:12px}
.item{display:flex;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:19px}
.item span{flex:1;min-width:0}
.hint{color:var(--dim);font-size:17px;margin:6px 0}
</style>
</head>
<body>
<div id="app">
  <header><div><div id="date"></div><div id="wk"></div></div><div id="hb"><button id="gear" class="mini" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button><button id="fs2" class="mini" aria-label="Fullscreen" title="Fullscreen"></button></div></header>
  <main>
    <div id="time"><span id="hm"></span><span id="ap"></span></div>
    <div id="wx"><span id="wxi"></span><span id="wxt">Loading weather</span></div>
    <div id="wx2"></div>
  </main>
  <footer>
    <div id="np"><b id="stn">No station selected</b><span id="st">Open Settings to find a station</span></div>
    <button id="cast" hidden aria-label="Cast to a speaker" title="Cast to a speaker"><svg viewBox="0 0 24 24"><path d="M2 16.1A5 5 0 0 1 5.9 20M2 12.05A9 9 0 0 1 9.95 20M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/><path d="M2 20h.01"/></svg></button><button id="prev">Prev</button><button id="pp">Play</button><button id="next">Next</button>
  </footer>
</div>

<div id="panel" hidden>
  <div class="sheet">
    <div class="row"><h2 style="flex:1;margin:0">Settings</h2><button id="close">Done</button></div>

    <h3>Weather</h3>
    <div class="row"><input id="cq" placeholder="Search for a city"><button id="cgo">Search</button></div>
    <div id="cres"></div>
    <label><input type="checkbox" id="fahr">Show °F instead of °C</label>

    <h3>Display</h3>
    <label><input type="checkbox" id="h24">24-hour clock</label>
    <label>Night dimming
      <select id="dim"><option value="auto">Automatic, 11pm to 6am</option><option value="on">Always dim</option><option value="off">Never</option></select>
    </label>
    <div class="row"><button id="fs" style="margin-left:0">Go fullscreen</button></div>
    <label><input type="checkbox" id="af">Go fullscreen on the first tap after opening</label>
    <label><input type="checkbox" id="kc">Show remote key codes</label>

    <h3>Radio</h3>
    <div class="row"><input id="rq" placeholder="Station name, for example BBC"><button id="rgo">Search</button></div>
    <div class="hint" id="rmsg"></div>
    <div id="rres"></div>
    <h4>Your stations</h4>
    <div id="favs"></div>
    <h4>Move your stations to another device</h4>
    <div class="row"><button id="exp" style="margin-left:0">Export stations</button><button id="imp">Import stations</button></div>
    <textarea id="xfer" rows="5" placeholder="Export shows your list here. To import, paste a list here and tap Import."></textarea>
    <div class="hint" id="xmsg"></div>
    <h4>Casting</h4>
    <div class="row"><button id="stopcast" style="margin-left:0">Stop casting</button></div>
    <div class="hint">Reloads the page, which always ends the cast.</div>
    <div class="hint" id="castlog"></div>
    <div class="hint">Volume uses the tablet’s own volume buttons.</div>
  </div>
</div>
<div id="keys" hidden></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const S={city:{name:"Prague",lat:50.0755,lon:14.4378},f:false,h24:true,favs:[],last:null,dim:"auto",keys:false,autofull:true};
try{const o=JSON.parse(localStorage.getItem("tc")||"{}");for(const k in o)S[k]=o[k]}catch(e){}
const save=()=>{try{localStorage.setItem("tc",JSON.stringify(S))}catch(e){}};
const z=n=>("0"+n).slice(-2);

/* Clock */
function tick(){
  const d=new Date();let h=d.getHours(),ap="";
  if(!S.h24){ap=h<12?"am":"pm";h=h%12||12}
  $("#hm").textContent=(S.h24?z(h):h)+":"+z(d.getMinutes());
  $("#ap").textContent=ap;
  $("#date").textContent=d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  const u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const doy=Math.round((u-Date.UTC(d.getFullYear(),0,0))/864e5);
  u.setUTCDate(u.getUTCDate()+4-(u.getUTCDay()||7));
  const wk=Math.ceil(((u-Date.UTC(u.getUTCFullYear(),0,1))/864e5+1)/7);
  $("#wk").textContent="W:"+wk+", D:"+doy;
  const hr=d.getHours();
  document.body.classList.toggle("dim",S.dim==="on"||(S.dim==="auto"&&(hr>=23||hr<6)));
}

/* Weather (Open-Meteo, no key needed) */
const WC={0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",56:"Freezing drizzle",57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",80:"Showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Snow showers",95:"Thunderstorm",96:"Thunderstorm with hail",99:"Thunderstorm with hail"};
/*ICONS*/
const IC_C="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z";
const IC_OPEN="M20 16.58A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 4 15.25";
const IC_SUN='<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
const IC_MOON='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
function wic(code,day){
  const sm=day?IC_SUN:IC_MOON;
  const g=(t,w,x)=>'<g transform="'+t+'" stroke-width="'+w+'">'+x+'</g>';
  const cl=(t,w)=>g(t,w,'<path style="fill:var(--bg)" d="'+IC_C+'"/>');
  const open=(x)=>'<path d="'+IC_OPEN+'"/><path d="'+x+'"/>';
  if(code===0)return sm;
  if(code===1)return g("translate(0 0) scale(.8)",2.5,sm)+cl("translate(11 12) scale(.5)",4);
  if(code===2)return g("translate(-1 -1) scale(.62)",3.2,sm)+cl("translate(6 7) scale(.72)",2.8);
  if(code===3)return '<path transform="translate(0 2)" d="'+IC_C+'"/>';
  if(code===45||code===48)return open("M3 19h18M6 22h12");
  if(code>=51&&code<=57)return open("M8 19v2M8 13v2M16 19v2M16 13v2M12 21v2M12 15v2");
  if(code===61)return open("M9 14v5M15 14v5");
  if(code===65||code===82)return open("M6 14v7M10 13v8M14 13v8M18 14v7");
  if(code>=61&&code<=67||code===80||code===81)return open("M16 13v8M8 13v8M12 15v8");
  if(code>=71&&code<=77||code===85||code===86)return '<path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"/><path d="M8 16h.01M8 20h.01M12 18h.01M12 22h.01M16 16h.01M16 20h.01"/>';
  if(code>=95)return '<path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/><path d="M13 11l-4 6h6l-4 6"/>';
  return '<path transform="translate(0 2)" d="'+IC_C+'"/>';
}
/*END*/
async function weather(){
  try{
    const u="https://api.open-meteo.com/v1/forecast?latitude="+S.city.lat+"&longitude="+S.city.lon+
      "&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1&temperature_unit="+(S.f?"fahrenheit":"celsius");
    const j=await(await fetch(u)).json();
    const c=j.current,d=j.daily,r=Math.round;
    $("#wxi").innerHTML="<svg viewBox=\"0 0 24 24\">"+wic(c.weather_code,c.is_day!==0)+"</svg>";
    $("#wxt").textContent=r(c.temperature_2m)+"°  "+(WC[c.weather_code]||"");
    $("#wx2").textContent=S.city.name+", Lo:"+r(d.temperature_2m_min[0])+"° Hi:"+r(d.temperature_2m_max[0])+"°, Rain: "+d.precipitation_probability_max[0]+"%";
  }catch(e){
    $("#wx2").textContent="Weather unavailable. Check the Wi-Fi connection.";
  }
}

/* Radio (stations from radio-browser.info) */
const audio=new Audio();audio.preload="none";audio.style.display="none";document.body.appendChild(audio);
const isCast=()=>!!(audio.remote&&audio.remote.state==="connected");
let playing=false;
const setSt=t=>{$("#st").textContent=t};
function ui(){
  $("#stn").textContent=S.last?S.last.name:"No station selected";
  $("#pp").textContent=playing?"Pause":"Play";
}
function play(st){
  const wasCast=isCast();
  S.last=st;save();
  audio.src=st.url;setSt("Connecting");playing=true;ui();
  const p=audio.play();
  if(p&&p.catch)p.catch(()=>{playing=false;setSt("Tap Play to start");ui()});
  if(wasCast){
    setSt("Choose your speaker again to switch station");
    try{audio.remote.prompt().catch(()=>{})}catch(e){}
  }
}
function stop(){playing=false;audio.pause();audio.removeAttribute("src");audio.load();setSt("Stopped");ui()}
function toggle(){
  if(playing){stop();return}
  if(S.last)play(S.last);
  else if(S.favs.length)play(S.favs[0]);
  else setSt("Open Settings to add a station");
}
function step(n){
  if(!S.favs.length){setSt("Open Settings to add a station");return}
  let i=-1;S.favs.forEach((f,k)=>{if(S.last&&f.id===S.last.id)i=k});
  play(S.favs[(i+n+S.favs.length)%S.favs.length]);
}
const next=()=>step(1),prev=()=>step(-1);
audio.addEventListener("playing",()=>{playing=true;setSt("Playing");ui()});
audio.addEventListener("waiting",()=>{if(playing)setSt("Connecting")});
audio.addEventListener("error",()=>{if(audio.getAttribute("src")){playing=false;setSt("Can’t play this station. Try another.");ui()}});

const SRV=["de1","de2","nl1","fi1"];
async function rb(q){
  for(const s of SRV){
    try{
      const r=await fetch("https://"+s+".api.radio-browser.info/json/stations/search?limit=12&hidebroken=true&order=clickcount&reverse=true&name="+encodeURIComponent(q));
      if(r.ok)return await r.json();
    }catch(e){}
  }
  throw new Error("offline");
}

/* Settings panel */
function rows(el,items,btns){
  el.innerHTML="";
  items.forEach(it=>{
    const r=document.createElement("div");r.className="item";
    const s=document.createElement("span");s.textContent=it.label;r.appendChild(s);
    btns.forEach(b=>{const x=document.createElement("button");x.textContent=b[0];x.onclick=()=>b[1](it);r.appendChild(x)});
    el.appendChild(r);
  });
}
function moveFav(id,d){
  const i=S.favs.findIndex(f=>f.id===id),j=i+d;
  if(i<0||j<0||j>=S.favs.length)return;
  const t=S.favs[i];S.favs[i]=S.favs[j];S.favs[j]=t;
  save();drawFavs();
}
function drawFavs(){
  rows($("#favs"),S.favs.map(f=>({label:f.name,st:f})),[
    ["Play",it=>play(it.st)],
    ["↑",it=>moveFav(it.st.id,-1)],
    ["↓",it=>moveFav(it.st.id,1)],
    ["Remove",it=>{S.favs=S.favs.filter(f=>f.id!==it.st.id);save();drawFavs()}]
  ]);
  if(!S.favs.length)$("#favs").innerHTML='<div class="hint">None yet. Search above and tap Add.</div>';
}
function openPanel(){
  $("#fahr").checked=S.f;$("#h24").checked=S.h24;$("#dim").value=S.dim;$("#kc").checked=S.keys;$("#af").checked=S.autofull;
  drawFavs();$("#panel").hidden=false;$("#close").focus();
}
function closePanel(){$("#panel").hidden=true}
$("#gear").onclick=openPanel;$("#close").onclick=closePanel;
$("#fahr").onchange=e=>{S.f=e.target.checked;save();weather()};
$("#h24").onchange=e=>{S.h24=e.target.checked;save();tick()};
$("#dim").onchange=e=>{S.dim=e.target.value;save();tick()};
$("#af").onchange=e=>{S.autofull=e.target.checked;save()};
$("#kc").onchange=e=>{S.keys=e.target.checked;save();$("#keys").hidden=true};
function isFull(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function toggleFull(){
  const d=document.documentElement,e=document.exitFullscreen||document.webkitExitFullscreen,r=d.requestFullscreen||d.webkitRequestFullscreen;
  if(isFull()){if(e)e.call(document)}else if(r)r.call(d);
}
const IC_IN='<svg viewBox="0 0 24 24"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg>';
const IC_OUT='<svg viewBox="0 0 24 24"><path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6"/></svg>';
function fsLabel(){const f=isFull(),b=$("#fs2");b.innerHTML=f?IC_OUT:IC_IN;b.setAttribute("aria-label",f?"Exit fullscreen":"Fullscreen");b.title=f?"Exit fullscreen":"Fullscreen"}
fsLabel();
$("#fs").onclick=toggleFull;$("#fs2").onclick=toggleFull;
let autoDone=false;
function autoFull(e){if(autoDone)return;if(e&&e.target&&e.target.closest&&e.target.closest("#cast"))return;autoDone=true;if(S.autofull&&!isFull())toggleFull()}
document.addEventListener("click",autoFull,true);
document.addEventListener("keydown",autoFull,true);
document.addEventListener("fullscreenchange",fsLabel);document.addEventListener("webkitfullscreenchange",fsLabel);

async function cityGo(){
  const q=$("#cq").value.trim();if(!q)return;
  try{
    const j=await(await fetch("https://geocoding-api.open-meteo.com/v1/search?count=5&name="+encodeURIComponent(q))).json();
    const res=(j.results||[]).map(c=>({label:[c.name,c.admin1,c.country].filter(Boolean).join(", "),c:c}));
    rows($("#cres"),res,[["Use",it=>{S.city={name:it.c.name,lat:it.c.latitude,lon:it.c.longitude};save();$("#cres").innerHTML="";weather()}]]);
    if(!res.length)$("#cres").innerHTML='<div class="hint">No city found.</div>';
  }catch(e){$("#cres").innerHTML='<div class="hint">Search failed. Check the connection.</div>'}
}
$("#cgo").onclick=cityGo;
$("#cq").onkeydown=e=>{if(e.key==="Enter")cityGo()};

async function radioGo(){
  const q=$("#rq").value.trim();if(!q)return;
  $("#rmsg").textContent="Searching";
  try{
    const list=await rb(q);
    const res=list.map(s=>({label:s.name.trim()+(s.country?", "+s.country:"")+(s.bitrate?", "+s.bitrate+" kbps":""),
      st:{id:s.stationuuid,name:s.name.trim(),url:s.url_resolved||s.url}}));
    $("#rmsg").textContent=res.length?"":"No stations found.";
    rows($("#rres"),res,[
      ["Play",it=>play(it.st)],
      ["Add",it=>{if(!S.favs.some(f=>f.id===it.st.id)){S.favs.push(it.st);save();drawFavs()}}]
    ]);
  }catch(e){$("#rmsg").textContent="Search failed. Check the connection."}
}
$("#rgo").onclick=radioGo;
$("#rq").onkeydown=e=>{if(e.key==="Enter")radioGo()};

$("#exp").onclick=()=>{
  const t=$("#xfer"),m=$("#xmsg");
  if(!S.favs.length){t.value="";m.textContent="Add some stations first.";return}
  t.value=JSON.stringify(S.favs);t.focus();t.select();
  let c=false;try{c=document.execCommand("copy")}catch(e){}
  m.textContent=(c?"Copied. ":"")+"Send this text to your other device, paste it in the same box there and tap Import.";
};
$("#imp").onclick=()=>{
  const m=$("#xmsg");let list;
  try{list=JSON.parse($("#xfer").value.trim())}catch(e){m.textContent="That doesn’t look like an exported list. Paste the whole text and try again.";return}
  if(!Array.isArray(list)){m.textContent="That doesn’t look like an exported list.";return}
  let n=0;
  list.forEach(s=>{
    if(s&&typeof s.id==="string"&&typeof s.name==="string"&&typeof s.url==="string"&&/^https?:\/\//.test(s.url)&&!S.favs.some(f=>f.id===s.id)){
      S.favs.push({id:s.id,name:s.name,url:s.url});n++;
    }
  });
  save();drawFavs();
  m.textContent=n?"Added "+n+(n===1?" station.":" stations."):"Nothing new to add.";
};
/* Cast to Chromecast / Nest speakers and groups, where Chrome supports it */
const reloadWith=(msg,resume)=>{try{sessionStorage.setItem("tcmsg",msg);if(resume)sessionStorage.setItem("tcresume","1")}catch(e){}location.reload()};
(function(){
  const cb=$("#cast"),rp=audio.remote;
  if(!rp)return;
  cb.hidden=false;
  const log=t=>{const el=$("#castlog");if(el)el.textContent="Last cast event: "+t+" at "+new Date().toLocaleTimeString()};
  const mark=()=>{cb.classList.toggle("on",rp.state==="connected")};
  try{rp.watchAvailability(a=>{cb.style.opacity=a||rp.state==="connected"?1:.45;cb.title=a?"Cast to a speaker":"No cast devices found yet";log(a?"speakers found":"no speakers found")}).catch(()=>{})}catch(e){}
  cb.onclick=()=>{
    /* While casting, the lit icon stops the cast */
    if(isCast()){try{audio.pause()}catch(e){}reloadWith("Casting stopped. Tap Play to listen here.");return}
    if(!playing){setSt("Start a station first, then tap Cast");return}
    log("cast tapped, state "+rp.state);
    rp.prompt().catch(e=>{
      const n=(e&&e.name)||"unknown";
      log(n+(e&&e.message?": "+e.message:""));
      if(isCast())return;
      if(n==="NotAllowedError"){reloadWith("Cast window closed, so the page was reset. Tap Cast to try again.",true);return}
      setSt(n==="NotFoundError"?"No cast devices found on this Wi-Fi":
        n==="InvalidStateError"?"Cast is busy, wait a moment and try again":
        n==="NotSupportedError"?"This station can’t be cast (NotSupportedError)":"Cast problem: "+n);
    });
  };
  rp.addEventListener("connecting",()=>{mark();log("connecting")});
  rp.addEventListener("connect",()=>{mark();setSt("Casting. Tap the lit icon to stop.");log("connected")});
  rp.addEventListener("disconnect",()=>{mark();setSt(playing?"Playing":"Stopped");log("disconnected")});
  mark();
})();
$("#stopcast").onclick=()=>{try{audio.pause()}catch(e){}reloadWith("Casting stopped. Tap Play to listen here.")};
$("#pp").onclick=toggle;$("#next").onclick=next;$("#prev").onclick=prev;

/* Remote and keyboard */
addEventListener("keydown",e=>{
  if(S.keys){const b=$("#keys");b.hidden=false;b.textContent="key: "+e.key+"   code: "+e.code+"   keyCode: "+e.keyCode}
  const open=!$("#panel").hidden;
  if(open){if(e.key==="Escape")closePanel();return}
  const m={ArrowRight:next,MediaTrackNext:next,ArrowLeft:prev,MediaTrackPrevious:prev,ArrowUp:toggleFull,ArrowDown:toggleFull,
    Enter:toggle," ":toggle,MediaPlayPause:toggle,MediaPlay:toggle,MediaPause:toggle,ContextMenu:openPanel,m:openPanel};
  if(m[e.key]){e.preventDefault();m[e.key]()}
});

/* Keep the screen awake where the browser allows it */
async function wake(){try{if(navigator.wakeLock)await navigator.wakeLock.request("screen")}catch(e){}}
wake();document.addEventListener("visibilitychange",()=>{if(!document.hidden)wake()});

tick();setInterval(tick,1000);
weather();setInterval(weather,20*60*1000);
ui();
try{
  const m=sessionStorage.getItem("tcmsg"),r=sessionStorage.getItem("tcresume");
  sessionStorage.removeItem("tcmsg");sessionStorage.removeItem("tcresume");
  if(r&&S.last)play(S.last);else if(m)setSt(m);
}catch(e){}
})();
</script>
